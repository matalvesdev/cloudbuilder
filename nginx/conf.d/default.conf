# ═══════════════════════════════════════════════════════════════════════════
# CloudBuilder — Default Server Block
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    # ─── Security Headers ────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── API Reverse Proxy ───────────────────────────────────────────────
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── Provision Engine API ────────────────────────────────────────────
    location /provision/ {
        set $provision_upstream http://provision-engine:50052;
        proxy_pass $provision_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;
    }

    # ─── gRPC-Web (Provision Engine) ─────────────────────────────────────
    location /grpc-web/ {
        set $grpc_upstream http://provision-engine:50052;
        grpc_pass $grpc_upstream;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto $scheme;
    }

    # ─── OPA Policy Engine ───────────────────────────────────────────────
    location /opa/ {
        set $opa_upstream http://opa:8181;
        proxy_pass $opa_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Collab Server (WebSocket) ───────────────────────────────────────
    location /ws/ {
        set $collab_upstream http://collab-server:8765;
        proxy_pass $collab_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Frontend (SPA) ──────────────────────────────────────────────────
    # Catch-all: serve frontend SPA
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets
        location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
            proxy_pass $frontend_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }
    }

    # ─── Health Check ────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }
}
