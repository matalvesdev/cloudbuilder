# CloudBuilder — Nginx Reverse Proxy
# HTTP → HTTPS redirect + reverse proxy to frontend/backend

upstream backend_upstream {
    server backend:8080;
}

# HTTP server — redirect to HTTPS (or serve in dev)
server {
    listen 80;
    server_name _;

    # Health check endpoint (no redirect)
    location /health {
        proxy_pass http://backend_upstream/actuator/health;
        proxy_set_header Host $host;
    }

    # API endpoints → backend
    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support for real-time events
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Actuator → backend
    location /actuator/ {
        proxy_pass http://backend_upstream/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

