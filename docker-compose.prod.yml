# ═══════════════════════════════════════════════════════════════════════════
# CloudBuilder — Production Docker Compose
# ═══════════════════════════════════════════════════════════════════════════
# Uso:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
#
# Serviços: PostgreSQL 16 + Backend (Spring Boot) + Frontend (Nginx)
# ═══════════════════════════════════════════════════════════════════════════

services:

  # ─── PostgreSQL 16 ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cloudbuilder-postgres
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudbuilder}
      POSTGRES_USER: ${POSTGRES_USER:-cloudbuilder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ERRO: Defina POSTGRES_PASSWORD no .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudbuilder} -d ${POSTGRES_DB:-cloudbuilder}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: always
    networks:
      - cloudbuilder-net

  # ─── Backend — Spring Boot 3.4 / Java 21 ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbuilder-backend
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudbuilder}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cloudbuilder}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?ERRO: Defina POSTGRES_PASSWORD no .env.prod}
      JWT_SECRET: ${JWT_SECRET:?ERRO: Defina JWT_SECRET no .env.prod. Gere com: openssl rand -base64 64}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    restart: always
    networks:
      - cloudbuilder-net

  # ─── Frontend — React 19 / Vite / Nginx ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudbuilder-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    restart: always
    networks:
      - cloudbuilder-net

# ─── Volumes ──────────────────────────────────────────────────────────────
volumes:
  pgdata:
    name: cloudbuilder_pgdata_prod

# ─── Networks ─────────────────────────────────────────────────────────────
networks:
  cloudbuilder-net:
    driver: bridge
    name: cloudbuilder_network_prod
