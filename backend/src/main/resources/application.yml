spring:
  application:
    name: cloudbuilder

  datasource:
    url: jdbc:postgresql://localhost:5432/cloudbuilder
    username: cloudbuilder
    password: cloudbuilder
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  modulith:
    events:
      jpa:
        schema-initialization:
          enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics


cloudbuilder:
  security:
    jwt-secret: "${JWT_SECRET:?JWT_SECRET env var obrigatoria. Gere com: openssl rand -base64 64}"
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    h2-console-enabled: false
    rate-limit:
      auth-max-requests: 10
      auth-window-seconds: 60
      global-max-requests: 500
      global-window-seconds: 60
