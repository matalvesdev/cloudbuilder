spring:
  autoconfigure:
    exclude: []
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:cloudbuilder;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  modulith:
    events:
      jpa:
        schema-initialization:
          enabled: true
      externalization:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 0.0
    enabled: false

cloudbuilder:
  kafka:
    enabled: false
  security:
    jwt-secret: cloudbuilder-dev-secret-key-change-in-production
    access-token-expiration: 86400000
    refresh-token-expiration: 604800000
    cors-allowed-origins: "*"
    h2-console-enabled: true
