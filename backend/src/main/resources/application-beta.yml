# CloudBuilder Beta Profile
# Used for beta testing with real authentication and PostgreSQL
# Inherits from application.yml defaults, overrides security settings

spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

cloudbuilder:
  kafka:
    enabled: false
  security:
    access-token-expiration: 86400000   # 24 hours (generous for beta)
    refresh-token-expiration: 604800000  # 7 days
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  sso:
    enabled: false
    redirect-uris: ${SSO_REDIRECT_URIS:http://localhost:3000/auth/callback,http://localhost:5173/auth/callback}
  ai:
    llm:
      provider: rule-based

server:
  port: 8080

logging:
  level:
    com.cloudbuilder: INFO
    org.springframework.security: WARN
