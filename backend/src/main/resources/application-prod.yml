# ─── CloudBuilder — Production Profile ───────────────────────────────────
# Ativado com SPRING_PROFILES_ACTIVE=prod

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/cloudbuilder
    username: cloudbuilder
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate # NEVER use update in prod — Flyway manages schema
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false

  modulith:
    events:
      jpa:
        schema-initialization:
          enabled: true
      externalization:
        enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    jmx:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
    metrics:
      enabled: true
  metrics:
    tags:
      application: cloudbuilder
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cloudbuilder:
  security:
    jwt-secret: ${JWT_SECRET}
    access-token-expiration: 900000    # 15 min
    refresh-token-expiration: 604800000 # 7 dias
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.cloudbuilder.io}
    h2-console-enabled: false
    rate-limit:
      auth-max-requests: 10
      auth-window-seconds: 60
      global-max-requests: 1000
      global-window-seconds: 60
      tenant-max-requests: 500
      tenant-window-seconds: 60
