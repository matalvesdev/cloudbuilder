# ─── CloudBuilder — Prometheus Alert Rules ─────────────────────────────────
# Groups:
#   - cloudbuilder-backend: backend API health and performance
#   - cloudbuilder-infra: infrastructure-level alerts
# ────────────────────────────────────────────────────────────────────────────

groups:
  - name: cloudbuilder-backend
    interval: 30s
    rules:
      # ── High Error Rate (>1% of requests failing with 5xx over 5 minutes) ──
      - alert: HighErrorRate
        expr: |
          (
            rate(api_requests_total{status="5xx"}[5m])
            /
            rate(api_requests_total[5m])
          ) > 0.01
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "High error rate on {{ $labels.endpoint }}"
          description: |
            Error rate on endpoint {{ $labels.endpoint }} is {{ $value | humanizePercentage }} 
            (threshold: >1%) over the last 5 minutes.

      # ── High Latency (p95 > 500ms over 5 minutes) ──────────────────────────
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            rate(api_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High latency on {{ $labels.endpoint }}"
          description: |
            p95 latency on endpoint {{ $labels.endpoint }} is {{ $value | humanizeDuration }} 
            (threshold: >500ms) over the last 5 minutes.

      # ── High Database Connection Pool Usage (>80%) ─────────────────────────
      - alert: HighDbConnectionPool
        expr: |
          hikaricp_connections_active / hikaricp_connections_total > 0.8
        for: 2m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database connection pool at {{ $value | humanizePercentage }}"
          description: |
            Connection pool utilization is at {{ $value | humanizePercentage }} 
            (threshold: >80%). Consider increasing pool size.

      # ── Instance Down (backend unreachable for 1 minute) ───────────────────
      - alert: InstanceDown
        expr: up{job="cloudbuilder-backend"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Backend instance {{ $labels.instance }} is down"
          description: "Backend instance has been unreachable for more than 1 minute."

  - name: cloudbuilder-infra
    interval: 60s
    rules:
      # ── Low Disk Space (<500MB free) ───────────────────────────────────────
      - alert: LowDiskSpace
        expr: |
          disk_total - disk_usable > 0
          # Note: this is a placeholder — actual disk metrics come from node_exporter
          # For containerized env, use: container_fs_usage_bytes / container_fs_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: ops
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below threshold. Investigate log cleanup."

      # ── JVM Heap Usage (>85%) ──────────────────────────────────────────────
      - alert: HighJvmHeapUsage
        expr: |
          jvm_memory_used_bytes{area="heap"} 
          / 
          jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "JVM heap at {{ $value | humanizePercentage }}"
          description: |
            JVM heap usage is at {{ $value | humanizePercentage }} 
            (threshold: >85%). Consider increasing heap or investigating leak.
