# ═══════════════════════════════════════════════════════════════════════════
# CloudBuilder — Nginx Production Configuration
# ═══════════════════════════════════════════════════════════════════════════
# Serves the React SPA, proxies /api/ to the backend, applies security
# headers, gzip compression, and aggressive caching for hashed assets.
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ─── Gzip Compression ────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        image/x-icon;

    # ─── Hashed Static Assets (1 year immutable) ─────────────────────────
    # Files with hash in name (e.g., index.a1b2c3.js, styles.d4e5f6.css)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
        access_log off;
    }

    # ─── SPA Catch-All ───────────────────────────────────────────────────
    # All other routes serve index.html so React Router can handle them
    location / {
        try_files $uri $uri/ /index.html;

        # HTML should NOT be cached aggressively
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate" always;
            expires -1;
        }
    }

    # ─── API Reverse Proxy ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 90s;

        # Buffer size
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;

        # Disable buffering for SSE (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── Deny access to hidden files ─────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Deny access to /node_modules or /src ────────────────────────────
    location ~ ^/(node_modules|src|\.env) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
