<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatura - CloudBuilder</title>
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { background: #0a1128; padding: 40px; text-align: center; }
        .header h1 { color: #ccff00; margin: 0; font-size: 24px; }
        .content { padding: 40px; }
        .content h2 { color: #0a1128; font-size: 20px; margin-top: 0; }
        .content p { color: #475569; line-height: 1.6; }
        .invoice { background: #f8fafc; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .invoice-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
        .invoice-row:last-child { border-bottom: none; font-weight: bold; }
        .btn { display: inline-block; background: #ccff00; color: #0a1128; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 20px 0; }
        .footer { background: #f8fafc; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CloudBuilder</h1>
        </div>
        <div class="content">
            <h2>Sua Fatura 📄</h2>
            <p>Olá {{name}},</p>
            <p>Sua fatura de {{month}}/{{year}} está disponível.</p>
            
            <div class="invoice">
                <div class="invoice-row">
                    <span>Plano</span>
                    <span>{{plan}}</span>
                </div>
                <div class="invoice-row">
                    <span>Período</span>
                    <span>{{period}}</span>
                </div>
                <div class="invoice-row">
                    <span>Valor</span>
                    <span>{{amount}}</span>
                </div>
            </div>
            
            <a href="{{billing_url}}" class="btn">Ver Detalhes</a>
            
            <p>Se tiver dúvidas sobre sua fatura, entre em contato conosco.</p>
        </div>
        <div class="footer">
            <p>© 2026 CloudBuilder. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
