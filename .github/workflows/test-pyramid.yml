name: CloudBuilder Test Pyramid

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly chaos + load tests (main only)
    - cron: '0 3 * * *'

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  GO_VERSION: '1.24'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Layer 1-3: Unit Tests (Backend / Frontend / Go)
  # ═══════════════════════════════════════════════════════════════
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudbuilder
          POSTGRES_USER: cloudbuilder
          POSTGRES_PASSWORD: cloudbuilder
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: cd backend && ./mvnw compile -q
      - name: Test
        run: cd backend && ./mvnw test -q
      - name: JaCoCo Coverage
        run: cd backend && ./mvnw verify -q || true
        continue-on-error: true

  frontend-unit:
    name: Frontend Unit + Property Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npm run typecheck
      - name: Lint
        run: cd frontend && npm run lint
      - name: Unit Tests (Vitest)
        run: cd frontend && npx vitest run --reporter=verbose
      - name: Build
        run: cd frontend && npm run build

  go-unit:
    name: Go Engine Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: provision-engine/go.sum
      - name: Vet
        run: cd provision-engine && go vet ./...
      - name: Build
        run: cd provision-engine && go build ./cmd/provision-engine/
      - name: Test with coverage
        run: cd provision-engine && go test -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: provision-engine/coverage.out

  # ═══════════════════════════════════════════════════════════════
  # Test Metrics Collection
  # ═══════════════════════════════════════════════════════════════
  test-metrics:
    name: Collect Test Metrics
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit, go-unit]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: provision-engine/go.sum

      - name: Collect Backend Metrics
        id: backend
        run: |
          cd backend
          OUTPUT=$(mvn test 2>&1 || true)
          TESTS=$(echo "$OUTPUT" | grep -oP 'Tests run: \K[0-9]+' | tail -1 || echo "0")
          FAILURES=$(echo "$OUTPUT" | grep -oP 'Failures: \K[0-9]+' | tail -1 || echo "0")
          ERRORS=$(echo "$OUTPUT" | grep -oP 'Errors: \K[0-9]+' | tail -1 || echo "0")
          SKIPPED=$(echo "$OUTPUT" | grep -oP 'Skipped: \K[0-9]+' | tail -1 || echo "0")
          echo "tests=$TESTS" >> $GITHUB_OUTPUT
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "Backend: $TESTS tests, $FAILURES failures, $ERRORS errors, $SKIPPED skipped"

      - name: Collect Frontend Metrics
        id: frontend
        run: |
          cd frontend
          npm ci
          OUTPUT=$(npx vitest run --reporter=verbose 2>&1 || true)
          TESTS=$(echo "$OUTPUT" | grep -oP 'Tests  \K[0-9]+(?= passed)' | head -1 || echo "0")
          echo "tests=$TESTS" >> $GITHUB_OUTPUT
          echo "Frontend: $TESTS tests"

      - name: Collect Go Engine Metrics
        id: goengine
        run: |
          cd provision-engine
          OUTPUT=$(go test ./... -count=1 2>&1 || true)
          OK=$(echo "$OUTPUT" | grep -c "^ok" || echo "0")
          FAIL=$(echo "$OUTPUT" | grep -c "^FAIL" || echo "0")
          echo "packages_ok=$OK" >> $GITHUB_OUTPUT
          echo "packages_fail=$FAIL" >> $GITHUB_OUTPUT
          echo "Go Engine: $OK packages OK, $FAIL packages FAIL"

      - name: Generate Metrics JSON
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BACKEND_TESTS=${{ steps.backend.outputs.tests }}
          BACKEND_FAILURES=${{ steps.backend.outputs.failures }}
          BACKEND_ERRORS=${{ steps.backend.outputs.errors }}
          BACKEND_SKIPPED=${{ steps.backend.outputs.skipped }}
          FRONTEND_TESTS=${{ steps.frontend.outputs.tests }}
          GO_OK=${{ steps.goengine.outputs.packages_ok }}
          GO_FAIL=${{ steps.goengine.outputs.packages_fail }}
          TOTAL=$(( BACKEND_TESTS + FRONTEND_TESTS + GO_OK ))
          FAILURES=$(( BACKEND_FAILURES + BACKEND_ERRORS + GO_FAIL ))

          cat > metrics.json <<EOF
          {
            "timestamp": "$TIMESTAMP",
            "date": "$DATE",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "overall": {
              "totalTests": $TOTAL,
              "failures": $FAILURES,
              "allPassing": $([ $FAILURES -eq 0 ] && echo true || echo false)
            },
            "backend": {
              "tests": $BACKEND_TESTS,
              "failures": $BACKEND_FAILURES,
              "errors": $BACKEND_ERRORS,
              "skipped": $BACKEND_SKIPPED
            },
            "frontend": {
              "tests": $FRONTEND_TESTS
            },
            "goEngine": {
              "packagesOk": $GO_OK,
              "packagesFail": $GO_FAIL
            }
          }
          EOF
          echo "📊 Metrics: $TOTAL tests, $FAILURES failures"

      - name: Upload Metrics Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-metrics-${{ github.run_number }}
          path: metrics.json
          retention-days: 90

      - name: Comment PR with Metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metrics = JSON.parse(fs.readFileSync('metrics.json', 'utf8'));
            const status = metrics.overall.allPassing ? '✅' : '❌';
            const total = metrics.overall.totalTests;
            const failures = metrics.overall.failures;

            const body = `## ${status} Test Metrics — Run #${context.runNumber}

            | Layer | Tests | Status |
            |-------|-------|--------|
            | ☕ Backend | ${metrics.backend.tests} (skipped: ${metrics.backend.skipped}) | ${metrics.backend.failures === 0 && metrics.backend.errors === 0 ? '✅' : '❌'} |
            | ⚛ Frontend | ${metrics.frontend.tests} | ✅ |
            | 🐹 Go Engine | ${metrics.goEngine.packagesOk} packages | ${metrics.goEngine.packagesFail === 0 ? '✅' : '❌'} |
            | **Total** | **${total}** | **${status}** |

            <details>
            <summary>📊 Metrics JSON</summary>

            \`\`\`json
            ${JSON.stringify(metrics, null, 2)}
            \`\`\`
            </details>

            [View Dashboard](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/docs/test-results/dashboard.html) · [View Run](${metrics.run_url})
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Test Metrics — Run'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ═══════════════════════════════════════════════════════════════
  # Layer 5: Mutation Testing (Frontend)
  # ═══════════════════════════════════════════════════════════════
  mutation-testing:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    needs: [frontend-unit]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Mutation Test
        run: cd frontend && npx stryker run --reporters=clear-text,progress
      - name: Check mutation score
        run: |
          if [ -f frontend/reports/mutation/mutation-report.json ]; then
            SCORE=$(cat frontend/reports/mutation/mutation-report.json | python3 -c "import sys,json; print(json.load(sys.stdin)['totals']['killed'] / max(json.load(sys.stdin)['totals']['total'], 1) * 100)" 2>/dev/null || echo "0")
            echo "Mutation score: ${SCORE}%"
            if (( $(echo "$SCORE < 80" | bc -l) )); then
              echo "::warning::Mutation score ${SCORE}% is below 80% threshold"
            fi
          fi
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════
  # Layer 7: Integration Tests (E2E Playwright)
  # ═══════════════════════════════════════════════════════════════
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-unit, frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: E2E Tests
        run: cd frontend && npx playwright test
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════
  # Layer 9: Load Tests (k6) — main branch only
  # ═══════════════════════════════════════════════════════════════
  load-tests:
    name: Load Tests (k6)
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6
      - name: Smoke Test
        run: cd frontend && k6 run ../tests/load/smoke.js
      - name: Load Test
        run: cd frontend && k6 run ../tests/load/load.js
      - name: Upload Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results
          path: "*.json"

  # ═══════════════════════════════════════════════════════════════
  # Layer 11: Security Scanning
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend Audit
        run: cd frontend && npm audit --audit-level=high
      - name: OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8080
          rules_file_name: 'tests/security/zap-baseline.yaml'
          fail_action: false

  # ═══════════════════════════════════════════════════════════════
  # Nightly Metrics + Trend Report
  # ═══════════════════════════════════════════════════════════════
  nightly-metrics:
    name: Nightly Metrics Collection
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: provision-engine/go.sum

      - name: Collect All Metrics
        id: metrics
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DATE=$(date -u +"%Y-%m-%d")
          COMMIT=$(git rev-parse --short HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # Backend
          cd backend
          B_OUTPUT=$(mvn test 2>&1 || true)
          B_TESTS=$(echo "$B_OUTPUT" | grep -oP 'Tests run: \K[0-9]+' | tail -1 || echo "0")
          B_FAIL=$(echo "$B_OUTPUT" | grep -oP 'Failures: \K[0-9]+' | tail -1 || echo "0")
          B_ERR=$(echo "$B_OUTPUT" | grep -oP 'Errors: \K[0-9]+' | tail -1 || echo "0")
          B_SKIP=$(echo "$B_OUTPUT" | grep -oP 'Skipped: \K[0-9]+' | tail -1 || echo "0")
          cd ..

          # Frontend
          cd frontend
          npm ci --silent
          F_OUTPUT=$(npx vitest run --reporter=verbose 2>&1 || true)
          F_TESTS=$(echo "$F_OUTPUT" | grep -oP 'Tests  \K[0-9]+(?= passed)' | head -1 || echo "0")
          F_FILES=$(echo "$F_OUTPUT" | grep -oP 'Test Files  \K[0-9]+' | head -1 || echo "0")
          cd ..

          # TypeScript
          cd frontend
          TSC_OUT=$(npx tsc --noEmit 2>&1 || true)
          TSC_ERR=$(echo "$TSC_OUT" | grep -c "error TS" || echo "0")
          cd ..

          # Go Engine
          cd provision-engine
          G_OUTPUT=$(go test ./... -count=1 2>&1 || true)
          G_OK=$(echo "$G_OUTPUT" | grep -c "^ok" || echo "0")
          G_FAIL=$(echo "$G_OUTPUT" | grep -c "^FAIL" || echo "0")
          cd ..

          TOTAL=$(( B_TESTS + F_TESTS + G_OK ))
          FAILURES=$(( B_FAIL + B_ERR + G_FAIL ))

          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "b_tests=$B_TESTS" >> $GITHUB_OUTPUT
          echo "b_fail=$B_FAIL" >> $GITHUB_OUTPUT
          echo "b_err=$B_ERR" >> $GITHUB_OUTPUT
          echo "b_skip=$B_SKIP" >> $GITHUB_OUTPUT
          echo "f_tests=$F_TESTS" >> $GITHUB_OUTPUT
          echo "f_files=$F_FILES" >> $GITHUB_OUTPUT
          echo "tsc_err=$TSC_ERR" >> $GITHUB_OUTPUT
          echo "g_ok=$G_OK" >> $GITHUB_OUTPUT
          echo "g_fail=$G_FAIL" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "failures=$FAILURES" >> $GITHUB_OUTPUT

          echo "📊 Nightly: $TOTAL tests, $FAILURES failures"

      - name: Append to History
        run: |
          cat > /tmp/entry.json <<EOF
          {
            "timestamp": "${{ steps.metrics.outputs.timestamp }}",
            "commit": "${{ steps.metrics.outputs.commit }}",
            "branch": "${{ steps.metrics.outputs.branch }}",
            "backend": {
              "tests": ${{ steps.metrics.outputs.b_tests }},
              "failures": ${{ steps.metrics.outputs.b_fail }},
              "errors": ${{ steps.metrics.outputs.b_err }},
              "skipped": ${{ steps.metrics.outputs.b_skip }}
            },
            "frontend": {
              "tests": ${{ steps.metrics.outputs.f_tests }},
              "files": ${{ steps.metrics.outputs.f_files }}
            },
            "goEngine": {
              "packagesOk": ${{ steps.metrics.outputs.g_ok }},
              "packagesFail": ${{ steps.metrics.outputs.g_fail }}
            },
            "typescript": {
              "errors": ${{ steps.metrics.outputs.tsc_err }}
            },
            "notes": "nightly scheduled run"
          }
          EOF
          python3 scripts/append-history.py /tmp/entry.json docs/test-results/history.json

      - name: Generate Trend Report
        run: python3 scripts/generate-trend-report.py docs/test-results/history.json /tmp/trend-report.md

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-trend-report-${{ steps.metrics.outputs.date }}
          path: /tmp/trend-report.md
          retention-days: 90

      - name: Commit History Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/test-results/history.json
          git diff --cached --quiet || git commit -m "chore: nightly metrics — ${{ steps.metrics.outputs.date }} [skip ci]"
          git push

      - name: Create Issue with Report
        if: steps.metrics.outputs.failures != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/trend-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Nightly Test Failures — ${{ steps.metrics.outputs.date }}`,
              body: report + '\n\n---\n*Auto-created by nightly metrics workflow*',
              labels: ['bug', 'tests', 'automated']
            });

  # ═══════════════════════════════════════════════════════════════
  # Layer 10: Chaos Tests — nightly only
  # ═══════════════════════════════════════════════════════════════
  chaos-tests:
    name: Chaos Experiments
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Docker Compose
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          sleep 30
          curl -sf http://localhost:8080/actuator/health/liveness || exit 1
      - name: Run Kafka Kill Chaos
        run: bash tests/chaos/kafka-kill.sh
      - name: Run DB Latency Chaos
        run: bash tests/chaos/db-latency.sh
      - name: Run OPA Kill Chaos
        run: bash tests/chaos/opa-kill.sh
      - name: Cleanup
        if: always()
        run: docker compose down -v
