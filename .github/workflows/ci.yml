name: CloudBuilder CI

on:
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  GO_VERSION: '1.24'

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudbuilder
          POSTGRES_USER: cloudbuilder
          POSTGRES_PASSWORD: cloudbuilder
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: cd backend && ./mvnw compile -q
      - name: Test
        run: cd backend && ./mvnw test -q
      - name: Security audit (dependencies)
        run: cd backend && ./mvnw org.owasp:dependency-check-maven:check -q
      - name: Package
        run: cd backend && ./mvnw package -DskipTests -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npm run typecheck
      - name: Lint
        run: cd frontend && npm run lint
      - name: Test (Vitest)
        run: cd frontend && npm run test
      - name: Build (Vite)
        run: cd frontend && npm run build
      - name: Security audit (npm)
        run: cd frontend && npm audit --audit-level=high

  provision-engine:
    name: Provision Engine (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: provision-engine/go.sum
      - name: Vet
        run: cd provision-engine && go vet ./...
      - name: Build
        run: cd provision-engine && go build ./cmd/provision-engine/
      - name: Test with coverage
        run: cd provision-engine && go test -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: provision-engine/coverage.out

  test-metrics:
    name: Test Metrics Summary
    runs-on: ubuntu-latest
    needs: [backend, frontend, provision-engine]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect Metrics
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > docs/test-results/metrics-${DATE}.json <<EOF
          {
            "timestamp": "$TIMESTAMP",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "run": ${{ github.run_number }},
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          echo "✅ Metrics snapshot saved"
      - name: Upload Metrics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-metrics-${{ github.run_number }}
          path: docs/test-results/metrics-*.json
          retention-days: 90
      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 📊 Test Metrics — CI Run #${context.runNumber}

            | Layer | Status |
            |-------|--------|
            | ☕ Backend | ${{ needs.backend.result == 'success' ? '✅' : '❌' }} |
            | ⚛ Frontend | ${{ needs.frontend.result == 'success' ? '✅' : '❌' }} |
            | 🐹 Go Engine | ${{ needs.provision-engine.result == 'success' ? '✅' : '❌' }} |

            [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · [Dashboard](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.sha}/docs/test-results/dashboard.html)
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Test Metrics — CI Run'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: java, javascript
        continue-on-error: true

  mutation-testing:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Run Stryker
        run: cd frontend && npx stryker run --reporters clear-text,html
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/mutation-report.html

  e2e-visual:
    name: E2E + Visual Regression
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps
      - name: Run Playwright E2E
        run: cd frontend && npx playwright test
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
