name: CloudBuilder CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  GO_VERSION: '1.23'

jobs:
  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cloudbuilder
          POSTGRES_USER: cloudbuilder
          POSTGRES_PASSWORD: cloudbuilder
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Compile
        run: cd backend && ./mvnw compile -q
      - name: Test
        run: cd backend && ./mvnw test -q
      - name: Security audit (dependencies)
        run: cd backend && ./mvnw org.owasp:dependency-check-maven:check -q
      - name: Package
        run: cd backend && ./mvnw package -DskipTests -q

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Typecheck
        run: cd frontend && npm run typecheck
      - name: Lint
        run: cd frontend && npm run lint
      - name: Test (Vitest)
        run: cd frontend && npm run test
      - name: Build (Vite)
        run: cd frontend && npm run build
      - name: Security audit (npm)
        run: cd frontend && npm audit --audit-level=high

  provision-engine:
    name: Provision Engine (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: provision-engine/go.sum
      - name: Vet
        run: cd provision-engine && go vet ./...
      - name: Build
        run: cd provision-engine && go build ./cmd/provision-engine/
      - name: Test with coverage
        run: cd provision-engine && go test -coverprofile=coverage.out ./...
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: provision-engine/coverage.out

  # === Test Pyramid L5: Mutation Testing ===
  mutation-testing:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Run Stryker
        run: cd frontend && npx stryker run --reporters clear-text,html
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: frontend/reports/mutation-report.html

  # === Test Pyramid L8: E2E Playwright ===
  e2e-visual:
    name: E2E + Visual Regression
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci
      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps
      - name: Run Playwright E2E
        run: cd frontend && npx playwright test
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
