name: CloudBuilder Docker Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'main'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloudbuilder-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/cloudbuilder-frontend
  PROVISION_ENGINE_IMAGE: ghcr.io/${{ github.repository_owner }}/cloudbuilder-provision-engine
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  meta:
    name: Generate metadata
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - id: meta
        run: |
          REF="${{ github.ref_name }}"
          if [[ "$REF" == "main" ]]; then
            echo "tags=$(echo -n '[\"latest\",\"main\"]')" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == v* ]]; then
            echo "tags=$(echo -n '[\"$REF\",\"latest\"]')" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$(echo -n '[\"$REF\"]')" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Build & Push Backend
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract tags for backend
        id: backend_tags
        run: |
          TAGS="${{ needs.meta.outputs.tags }}"
          # Transform JSON array to comma-separated with registry prefix
          PREFIX="${{ env.BACKEND_IMAGE }}:"
          TAGS_CSV=$(echo "$TAGS" | python3 -c "import json,sys; tags=json.load(sys.stdin); print(','.join(['${{ env.BACKEND_IMAGE }}:'+t for t in tags]))")
          echo "tags=$TAGS_CSV" >> "$GITHUB_OUTPUT"
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Build & Push Frontend
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract tags for frontend
        id: frontend_tags
        run: |
          TAGS="${{ needs.meta.outputs.tags }}"
          TAGS_CSV=$(echo "$TAGS" | python3 -c "import json,sys; tags=json.load(sys.stdin); print(','.join(['${{ env.FRONTEND_IMAGE }}:'+t for t in tags]))")
          echo "tags=$TAGS_CSV" >> "$GITHUB_OUTPUT"
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  provision-engine:
    name: Build & Push Provision Engine
    needs: [meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract tags for provision-engine
        id: pe_tags
        run: |
          TAGS="${{ needs.meta.outputs.tags }}"
          TAGS_CSV=$(echo "$TAGS" | python3 -c "import json,sys; tags=json.load(sys.stdin); print(','.join(['${{ env.PROVISION_ENGINE_IMAGE }}:'+t for t in tags]))")
          echo "tags=$TAGS_CSV" >> "$GITHUB_OUTPUT"
      - name: Build and push provision-engine
        uses: docker/build-push-action@v6
        with:
          context: ./provision-engine
          push: true
          tags: ${{ steps.pe_tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
