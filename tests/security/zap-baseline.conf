# CloudBuilder — OWASP ZAP Baseline Scan Configuration
# ADR-036 Layer 11: Penetration/Security Testing
#
# Run: docker run -v $(pwd)/tests/security:/zap/wrk/:rw \
#   ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
#   -t http://localhost:8080 -c /zap/wrk/zap-baseline.conf \
#   -r /zap/wrk/zap-report.html
#
# Or with npm script:
#   cd tests/security && bash run-zap-baseline.sh

# ─── Target ─────────────────────────────────────────────────────
# Target URL is passed via -t flag, not in config

# ─── Scan Policy ────────────────────────────────────────────────
# Include all standard active scan rules
# Disable slow/intrusive tests for CI speed
rules.cookie.securityFlags.disabled=true
rules.auth.messages.max=0
rules.global.maxChildren=0
rules.global.maxTagLen=0

# ─── Excluded Paths ─────────────────────────────────────────────
# Skip static assets (frontend SPA)
# Backend-only scan for API contract verification
# Endpoints to skip (external OAuth providers):
#   /api/v1/auth/oauth2/*
#   /api/v1/auth/sso/*

# ─── Alert Thresholds ───────────────────────────────────────────
# Low = report everything (thorough baseline)
# Medium = only medium and above (default baseline)
# High = only high and critical
replacer.full_list.0.description=Auth header
replacer.full_list.0.enabled=true
replacer.full_list.0.matchtype=HTTP_Headers
replacer.full_list.0.matchstr=Authorization
replacer.full_list.0.replacement=Bearer test-token-for-scan
replacer.full_list.0.type=2

# ─── Context ────────────────────────────────────────────────────
# Authentication context for authenticated scanning
# Requires ZAP context file or inline config
context.name=CloudBuilder
context.enabled=true

# ─── Spider ─────────────────────────────────────────────────────
spider.maxDepth=3
spider.maxChildren=0
spider.parseComments=false
spider.parseSitemap=false
spider.parseRobotsTxt=false
spider.threadCount=4

# ─── Active Scan ────────────────────────────────────────────────
# Faster CI scans: reduce scan strength
scanner.strength=LOW
scanner.threshold=MEDIUM

# ─── Reporting ──────────────────────────────────────────────────
report.title=CloudBuilder Security Baseline
report.format=HTML
report.timestamp=true

# ─── Fail Criteria ──────────────────────────────────────────────
# Fail the CI job if High or Critical alerts found
# Low/Medium = warn only
failOnError=false
