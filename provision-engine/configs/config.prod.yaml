# Production overrides
server:
  http:
    addr: ":8080"
    read_timeout: 10s
    write_timeout: 30s
  grpc:
    addr: ":9090"

database:
  postgres:
    max_open_conns: 50
    max_idle_conns: 20
    max_lifetime: 3m
    sslmode: require

redis:
  pool_size: 20

engine:
  workers:
    concurrency: 8
    max_concurrent: 50
  drift:
    scan_interval: 10m

observability:
  otel:
    enabled: true
  logging:
    level: warn
    format: json
