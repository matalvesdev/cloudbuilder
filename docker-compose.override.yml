# CloudBuilder — Docker Compose Override para Desenvolvimento Local
# Uso: docker compose up -d
# (docker compose carrega docker-compose.override.yml automaticamente)

services:
  postgres:
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis:
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  zookeeper:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  kafka:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  otel-collector:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  prometheus:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  backend:
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - ./backend/build/libs:/app/libs
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  frontend:
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
