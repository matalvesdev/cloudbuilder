# CloudBuilder — Docker Compose Override para Desenvolvimento Local
# Uso: docker compose up -d
# (docker compose carrega docker-compose.override.yml automaticamente)

services:
  postgres:
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  backend:
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=dev
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

  frontend:
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
