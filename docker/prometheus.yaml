global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cloudbuilder-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'provision-engine'
    static_configs:
      - targets: ['provision-engine:9090']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
