[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=java org.springframework.boot.loader.launch.JarLauncher
directory=/app/backend
autostart=true
autorestart=true
startsecs=30
environment=SPRING_PROFILES_ACTIVE="%(ENV_SPRING_PROFILES_ACTIVE)s",SPRING_DATASOURCE_URL="%(ENV_DATABASE_URL)s",JWT_SECRET="%(ENV_JWT_SECRET)s",CLOUDBUILDER_ENCRYPTION_KEY="%(ENV_CLOUDBUILDER_ENCRYPTION_KEY)s",SPRING_FLYWAY_ENABLED="true",SPRING_JPA_HIBERNATE_DDL_AUTO="none",SPRING_JPA_DATABASE_PLATFORM="org.hibernate.dialect.PostgreSQLDialect",SERVER_PORT="8080"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:collab]
command=/app/provision-engine collab-server --port 8765 --jwt-secret %(ENV_JWT_SECRET)s
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
