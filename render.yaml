services:
  # Backend Spring Boot
  - type: web
    name: cloudbuilder-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDBUILDER_ENCRYPTION_KEY
        generateValue: true
      - key: SERVER_PORT
        value: 10000
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_OPTS
        value: "-Xmx384m -Xms256m"
    healthCheckPath: /actuator/health
    autoDeploy: true

  # Go Engine
  - type: web
    name: cloudbuilder-engine
    runtime: docker
    dockerfilePath: provision-engine/Dockerfile
    envVars:
      - key: PORT
        value: 50052
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
