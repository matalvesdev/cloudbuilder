services:
  # Backend Spring Boot
  - type: web
    name: cloudbuilder-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      # Neon exposes a PostgreSQL URL. Spring needs its JDBC equivalent
      # (jdbc:postgresql://...) plus the credentials separately.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDBUILDER_ENCRYPTION_KEY
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: render,render-lite
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JAVA_OPTS
        value: "-Xmx180m -Xms48m -Xss256k -XX:MaxMetaspaceSize=72m -XX:MaxDirectMemorySize=24m -XX:ReservedCodeCacheSize=24m -XX:+UseSerialGC -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -noverify -Djava.security.egd=file:/dev/./urandom -XX:+UseCompressedOops -XX:+UseCompressedClassPointers"
    healthCheckPath: /actuator/health
    autoDeploy: true

  # Go Engine
  - type: web
    name: cloudbuilder-engine
    runtime: docker
    plan: free
    dockerfilePath: provision-engine/Dockerfile
    dockerContext: provision-engine
    envVars:
      # The engine reads PORT at startup and binds its HTTP API to it.
      - key: PE_SERVER_JWT_SECRET
        sync: false
      - key: PE_SERVER_CORS_ORIGIN
        sync: false
      - key: PE_DATABASE_POSTGRES_HOST
        sync: false
      - key: PE_DATABASE_POSTGRES_PORT
        value: 5432
      - key: PE_DATABASE_POSTGRES_DATABASE
        sync: false
      - key: PE_DATABASE_POSTGRES_USERNAME
        sync: false
      - key: PE_DATABASE_POSTGRES_PASSWORD
        sync: false
      - key: PE_DATABASE_POSTGRES_SSLMODE
        value: require
    healthCheckPath: /health
    autoDeploy: true
