services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudbuilder-postgres
    environment:
      POSTGRES_DB: cloudbuilder
      POSTGRES_USER: cloudbuilder
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudbuilder}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbuilder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - db-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbuilder-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-beta}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudbuilder
      SPRING_DATASOURCE_USERNAME: cloudbuilder
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cloudbuilder}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: "true"
      JWT_SECRET: "${JWT_SECRET:?ERRO - Defina JWT_SECRET no .env. Gere com openssl rand -base64 64}"
      CLOUDBUILDER_ENCRYPTION_KEY: "${CLOUDBUILDER_ENCRYPTION_KEY:?ERRO - Defina CLOUDBUILDER_ENCRYPTION_KEY no .env. Gere com node -e \"console.log(require('crypto').randomBytes(64).toString('base64'))\"}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - frontend-net
      - db-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudbuilder-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - frontend-net

  provision-engine:
    build:
      context: ./provision-engine
      dockerfile: Dockerfile
    container_name: cloudbuilder-provision-engine
    ports:
      - "50051:50051"
      - "50052:50052"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:50052/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    networks:
      - frontend-net

  collab-server:
    build:
      context: ./provision-engine
      dockerfile: Dockerfile
    container_name: cloudbuilder-collab
    command: ["collab-server", "--port", "8765", "--jwt-secret", "${JWT_SECRET:?ERRO - Defina JWT_SECRET no .env}"]
    ports:
      - "8765:8765"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8765/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - frontend-net

  opa:
    image: openpolicyagent/opa:latest
    container_name: cloudbuilder-opa
    command: ["run", "--server", "-b", "/policies"]
    volumes:
      - ./opa/policies:/policies:ro
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - frontend-net

  nginx:
    image: nginx:alpine
    container_name: cloudbuilder-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    networks:
      - frontend-net

volumes:
  pgdata:
    name: cloudbuilder_pgdata
  frontend_dist:
    name: cloudbuilder_frontend_dist

networks:
  frontend-net:
    driver: bridge
    name: cloudbuilder_frontend
  db-net:
    driver: bridge
    name: cloudbuilder_db
