services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudbuilder-postgres
    environment:
      POSTGRES_DB: cloudbuilder
      POSTGRES_USER: cloudbuilder
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudbuilder}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudbuilder"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - db-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudbuilder-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudbuilder
      SPRING_DATASOURCE_USERNAME: cloudbuilder
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-cloudbuilder}
      JWT_SECRET: ${JWT_SECRET:?ERRO: Defina JWT_SECRET no .env. Gere com: openssl rand -base64 64}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - frontend-net
      - db-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudbuilder-frontend
    ports:
      - "3000:${FRONTEND_PORT:-3000}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.2'
          memory: 128M
    networks:
      - frontend-net

volumes:
  pgdata:
    name: cloudbuilder_pgdata

networks:
  frontend-net:
    driver: bridge
    name: cloudbuilder_frontend
  db-net:
    driver: bridge
    name: cloudbuilder_db
